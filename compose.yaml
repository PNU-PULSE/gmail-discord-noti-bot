services:
  admin:
    build: .
    environment:
      BOT_MODE: admin
      PORT: "8080"
      DATABASE_URL: jdbc:postgresql://db:5432/mail_bot_local
      DATABASE_USERNAME: mail_bot_local
      DATABASE_PASSWORD: local-test-db-password
      BOT_ADMIN_PASSWORD: ${BOT_ADMIN_PASSWORD:?Set BOT_ADMIN_PASSWORD in .env}
      BOT_CONFIG_KEY: ${BOT_CONFIG_KEY:?Set BOT_CONFIG_KEY in .env}
    ports:
      - "127.0.0.1:${BOT_LOCAL_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: mail_bot_local
      POSTGRES_USER: mail_bot_local
      POSTGRES_PASSWORD: local-test-db-password
    volumes:
      - local_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "mail_bot_local", "-d", "mail_bot_local"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  local_postgres:
